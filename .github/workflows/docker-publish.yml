name: Publish Docker Images

on:
  release:
    types: [prereleased, released]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-core:
    strategy:
      matrix:
        arch: [amd64, arm64]
        package:
          - name: api
            dockerfile: services/api/Dockerfile
          - name: cron
            dockerfile: services/cron/Dockerfile
          - name: worker
            dockerfile: services/worker/Dockerfile
          - name: mcp
            dockerfile: services/mcp/Dockerfile
          - name: web
            dockerfile: applications/web/Dockerfile
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      api-amd64: ${{ steps.digest.outputs.api-amd64 }}
      api-arm64: ${{ steps.digest.outputs.api-arm64 }}
      cron-amd64: ${{ steps.digest.outputs.cron-amd64 }}
      cron-arm64: ${{ steps.digest.outputs.cron-arm64 }}
      mcp-amd64: ${{ steps.digest.outputs.mcp-amd64 }}
      mcp-arm64: ${{ steps.digest.outputs.mcp-arm64 }}
      web-amd64: ${{ steps.digest.outputs.web-amd64 }}
      web-arm64: ${{ steps.digest.outputs.web-arm64 }}
      worker-amd64: ${{ steps.digest.outputs.worker-amd64 }}
      worker-arm64: ${{ steps.digest.outputs.worker-arm64 }}
    steps:
      - id: content-access
        if: matrix.package.name == 'web'
        env:
          APP_ID: ${{ secrets.KEEPER_BOT_APP_ID }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "KEEPER_BOT_APP_ID is missing; a release cannot ship without content." >&2
            exit 1
          fi
          echo "available=yes" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: steps.content-access.outputs.available == 'yes'
        with:
          app-id: ${{ secrets.KEEPER_BOT_APP_ID }}
          private-key: ${{ secrets.KEEPER_BOT_PRIVATE_KEY }}
          owner: keeperdotsh
          repositories: seo
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the content submodule
        if: steps.content-access.outputs.available == 'yes'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/keeperdotsh/".insteadOf \
            "https://github.com/keeperdotsh/"
          git submodule update --init applications/web/seo
          test -d applications/web/seo/blog
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/keeper-${{ matrix.package.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !github.event.release.prerelease }}
            type=semver,pattern={{major}},enable=${{ !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
          flavor: suffix=-${{ matrix.arch }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.package.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.package.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package.name }}-${{ matrix.arch }}
      - name: Verify the web image carries the llms text files
        if: matrix.package.name == 'web'
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          for file in llms.txt llms-full.txt; do
            docker run --rm --entrypoint test "$IMAGE" -s "dist/client/$file"
          done
      - id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TARGET: ${{ matrix.package.name }}-${{ matrix.arch }}
        run: echo "$TARGET=$DIGEST" >> "$GITHUB_OUTPUT"

  build-convenience:
    strategy:
      matrix:
        package: [standalone, services]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      services-amd64: ${{ steps.digest.outputs.services-amd64 }}
      services-arm64: ${{ steps.digest.outputs.services-arm64 }}
      standalone-amd64: ${{ steps.digest.outputs.standalone-amd64 }}
      standalone-arm64: ${{ steps.digest.outputs.standalone-arm64 }}
    steps:
      - id: content-access
        env:
          APP_ID: ${{ secrets.KEEPER_BOT_APP_ID }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "KEEPER_BOT_APP_ID is missing; a release cannot ship without content." >&2
            exit 1
          fi
          echo "available=yes" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: steps.content-access.outputs.available == 'yes'
        with:
          app-id: ${{ secrets.KEEPER_BOT_APP_ID }}
          private-key: ${{ secrets.KEEPER_BOT_PRIVATE_KEY }}
          owner: keeperdotsh
          repositories: seo
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the content submodule
        if: steps.content-access.outputs.available == 'yes'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/keeperdotsh/".insteadOf \
            "https://github.com/keeperdotsh/"
          git submodule update --init applications/web/seo
          test -d applications/web/seo/blog
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/keeper-${{ matrix.package }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !github.event.release.prerelease }}
            type=semver,pattern={{major}},enable=${{ !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
          flavor: suffix=-${{ matrix.arch }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/${{ matrix.package }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.package }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}-${{ matrix.arch }}
      - id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TARGET: ${{ matrix.package }}-${{ matrix.arch }}
        run: echo "$TARGET=$DIGEST" >> "$GITHUB_OUTPUT"

  merge-core-manifests:
    runs-on: ubuntu-latest
    needs: build-core
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package:
          - api
          - cron
          - worker
          - mcp
          - web
    outputs:
      api: ${{ steps.index.outputs.api }}
      cron: ${{ steps.index.outputs.cron }}
      mcp: ${{ steps.index.outputs.mcp }}
      web: ${{ steps.index.outputs.web }}
      worker: ${{ steps.index.outputs.worker }}
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/keeper-${{ matrix.package }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !github.event.release.prerelease }}
            type=semver,pattern={{major}},enable=${{ !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - name: Create multi-arch manifest
        id: index
        env:
          BUILT: ${{ toJSON(needs.build-core.outputs) }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/keeper-${{ matrix.package }}
          PACKAGE: ${{ matrix.package }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          sources=()
          for arch in amd64 arm64; do
            digest=$(jq -r --arg target "$PACKAGE-$arch" '.[$target] // empty' <<< "$BUILT")
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::The $arch build of keeper-$PACKAGE reported no digest."
              exit 1
            fi
            sources+=("$IMAGE@$digest")
          done
          tags=()
          for tag in $TAGS; do
            tags+=(--tag "$tag")
          done
          docker buildx imagetools create "${tags[@]}" --metadata-file "$RUNNER_TEMP/index.json" "${sources[@]}"
          digest=$(jq -r '."containerimage.descriptor".digest' "$RUNNER_TEMP/index.json")
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The registry returned no digest for keeper-$PACKAGE."
            exit 1
          fi
          echo "$PACKAGE=$digest" >> "$GITHUB_OUTPUT"

  merge-convenience-manifests:
    runs-on: ubuntu-latest
    needs: build-convenience
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package: [standalone, services]
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/keeper-${{ matrix.package }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !github.event.release.prerelease }}
            type=semver,pattern={{major}},enable=${{ !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - name: Create multi-arch manifest
        id: index
        env:
          BUILT: ${{ toJSON(needs.build-convenience.outputs) }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/keeper-${{ matrix.package }}
          PACKAGE: ${{ matrix.package }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          sources=()
          for arch in amd64 arm64; do
            digest=$(jq -r --arg target "$PACKAGE-$arch" '.[$target] // empty' <<< "$BUILT")
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::The $arch build of keeper-$PACKAGE reported no digest."
              exit 1
            fi
            sources+=("$IMAGE@$digest")
          done
          tags=()
          for tag in $TAGS; do
            tags+=(--tag "$tag")
          done
          docker buildx imagetools create "${tags[@]}" --metadata-file "$RUNNER_TEMP/index.json" "${sources[@]}"
          digest=$(jq -r '."containerimage.descriptor".digest' "$RUNNER_TEMP/index.json")
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The registry returned no digest for keeper-$PACKAGE."
            exit 1
          fi
          echo "keeper-$PACKAGE is published as $digest"

  deploy-targets:
    runs-on: ubuntu-latest
    needs: merge-core-manifests
    permissions: {}
    outputs:
      environments: ${{ steps.targets.outputs.environments }}
      version: ${{ steps.targets.outputs.version }}
    steps:
      - id: targets
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
          ON_PRERELEASE: ${{ vars.DEPLOY_ON_PRERELEASE }}
          ON_RELEASE: ${{ vars.DEPLOY_ON_RELEASE }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          targets=$ON_RELEASE
          if [ "$PRERELEASE" = "true" ]; then
            targets=$ON_PRERELEASE
          fi
          echo "environments=$(printf '%s' "${targets:-[]}" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  deploy-ecs:
    needs: [merge-core-manifests, deploy-targets]
    if: needs.deploy-targets.outputs.environments != '[]'
    strategy:
      max-parallel: 1
      matrix:
        environment: ${{ fromJSON(needs.deploy-targets.outputs.environments) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-ecs.yml
    secrets: inherit
    with:
      environment: ${{ matrix.environment }}
      version: ${{ needs.deploy-targets.outputs.version }}
      digests: ${{ toJSON(needs.merge-core-manifests.outputs) }}
