name: Deploy to ECS

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      digests:
        required: true
        type: string
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [staging, production]
      version:
        description: Published image version, without the leading v (e.g. 2.14.3)
        required: true
        type: string

concurrency:
  group: deploy-ecs-${{ inputs.environment }}
  cancel-in-progress: false

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.images.outputs.api }}
      cron: ${{ steps.images.outputs.cron }}
      mcp: ${{ steps.images.outputs.mcp }}
      web: ${{ steps.images.outputs.web }}
      worker: ${{ steps.images.outputs.worker }}
    steps:
      - name: Resolve the images to deploy
        id: images
        env:
          DIGESTS: ${{ inputs.digests }}
          EVENT: ${{ github.event_name }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$VERSION" =~ $semver ]]; then
            echo "::error::The version must be a published version without the leading v, such as 2.14.3."
            exit 1
          fi
          packages=(api cron mcp web worker)
          if [ -z "$DIGESTS" ]; then
            if [ "$EVENT" != "workflow_dispatch" ]; then
              echo "::error::The calling workflow passed no image digests."
              exit 1
            fi
            DIGESTS='{}'
            for package in "${packages[@]}"; do
              if ! manifest=$(docker buildx imagetools inspect "$REGISTRY/keeper-$package:$VERSION" --format '{{json .Manifest}}'); then
                echo "::error::keeper-$package:$VERSION was not found in the registry."
                exit 1
              fi
              DIGESTS=$(jq -c --arg package "$package" --argjson manifest "$manifest" '.[$package] = $manifest.digest' <<< "$DIGESTS")
            done
          fi
          for package in "${packages[@]}"; do
            digest=$(jq -r --arg package "$package" '.[$package] // empty' <<< "$DIGESTS")
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::There is no valid digest for keeper-$package."
              exit 1
            fi
            echo "$package=$REGISTRY/keeper-$package@$digest" >> "$GITHUB_OUTPUT"
            echo "- \`$REGISTRY/keeper-$package@$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      CLUSTER: keeper-${{ inputs.environment }}
      IMAGE_API: ${{ needs.resolve.outputs.api }}
      IMAGE_CRON: ${{ needs.resolve.outputs.cron }}
      IMAGE_MCP: ${{ needs.resolve.outputs.mcp }}
      IMAGE_WEB: ${{ needs.resolve.outputs.web }}
      IMAGE_WORKER: ${{ needs.resolve.outputs.worker }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Confirm every image is pinned by digest
        run: |
          set -euo pipefail
          for image in "$IMAGE_API" "$IMAGE_CRON" "$IMAGE_MCP" "$IMAGE_WEB" "$IMAGE_WORKER"; do
            if ! [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::An image to deploy is not pinned by digest; nothing was deployed."
              exit 1
            fi
          done

      - name: Run migrations
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "$CLUSTER-migrate" --query taskDefinition \
            | jq --arg image "$IMAGE_API" '.containerDefinitions[0].image = $image
                | {family, taskRoleArn, executionRoleArn, networkMode, containerDefinitions, volumes, requiresCompatibilities, cpu, memory, runtimePlatform}' \
            > migrate.json
          task_definition=$(aws ecs register-task-definition --cli-input-json file://migrate.json \
            --query taskDefinition.taskDefinitionArn --output text)

          network=$(aws ecs describe-services --cluster "$CLUSTER" --services "$CLUSTER-api" \
            --query 'services[0].networkConfiguration' --output json)

          task=$(aws ecs run-task --cluster "$CLUSTER" --launch-type FARGATE \
            --task-definition "$task_definition" --network-configuration "$network" \
            --query 'tasks[0].taskArn' --output text)

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task"

          exit_code=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$exit_code" != "0" ]; then
            echo "::error::Migration task exited with $exit_code; services were not updated."
            exit 1
          fi

      - name: Roll services
        run: |
          set -euo pipefail
          for package in api mcp worker cron web; do
            image_variable="IMAGE_${package^^}"
            service="$CLUSTER-$package"
            aws ecs describe-task-definition --task-definition "$service" --query taskDefinition \
              | jq --arg image "${!image_variable}" '.containerDefinitions[0].image = $image
                  | {family, taskRoleArn, executionRoleArn, networkMode, containerDefinitions, volumes, requiresCompatibilities, cpu, memory, runtimePlatform}' \
              > "$package.json"
            task_definition=$(aws ecs register-task-definition --cli-input-json "file://$package.json" \
              --query taskDefinition.taskDefinitionArn --output text)
            echo "$service=$task_definition" >> rolled.env
            aws ecs update-service --cluster "$CLUSTER" --service "$service" \
              --task-definition "$task_definition" --query 'service.serviceName' --output text
          done

      - name: Wait for every rollout to complete
        timeout-minutes: 30
        run: |
          set -euo pipefail
          while IFS='=' read -r service task_definition; do
            while true; do
              read -r state current < <(aws ecs describe-services --cluster "$CLUSTER" --services "$service" \
                --query "services[0].deployments[?status=='PRIMARY'] | [0].[rolloutState, taskDefinition]" --output text)
              if [ "$current" != "$task_definition" ]; then
                echo "::error::$service rolled back to $current; $task_definition did not deploy."
                exit 1
              fi
              case "$state" in
                COMPLETED) echo "$service deployed"; break ;;
                FAILED) echo "::error::$service deployment failed."; exit 1 ;;
                *) sleep 15 ;;
              esac
            done
          done < rolled.env

      - name: Record the deployed images
        run: |
          set -euo pipefail
          images=$(jq -n \
            --arg web "$IMAGE_WEB" --arg api "$IMAGE_API" --arg mcp "$IMAGE_MCP" \
            --arg worker "$IMAGE_WORKER" --arg cron "$IMAGE_CRON" \
            '{web: $web, api: $api, mcp: $mcp, worker: $worker, cron: $cron}')
          aws ssm put-parameter --name "/keeper/$ENVIRONMENT/images" \
            --type String --overwrite --value "$images" --query Version --output text
