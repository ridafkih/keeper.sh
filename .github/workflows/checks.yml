name: Check Code Standards

on:
  pull_request:

jobs:
  types:
    runs-on: ubuntu-latest
    steps:
      - id: content-access
        env:
          APP_ID: ${{ secrets.KEEPER_BOT_APP_ID }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "available=yes" >> "$GITHUB_OUTPUT"
          elif [ "$IS_FORK" = "true" ]; then
            echo "available=no" >> "$GITHUB_OUTPUT"
          else
            echo "KEEPER_BOT_APP_ID is missing outside a fork pull request." >&2
            exit 1
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: steps.content-access.outputs.available == 'yes'
        with:
          app-id: ${{ secrets.KEEPER_BOT_APP_ID }}
          private-key: ${{ secrets.KEEPER_BOT_PRIVATE_KEY }}
          owner: keeperdotsh
          repositories: seo

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the content submodule
        if: steps.content-access.outputs.available == 'yes'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/keeperdotsh/".insteadOf \
            "https://github.com/keeperdotsh/"
          git submodule update --init applications/web/seo
          test -d applications/web/seo/blog
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run types

  lint:
    runs-on: ubuntu-latest
    steps:
      - id: content-access
        env:
          APP_ID: ${{ secrets.KEEPER_BOT_APP_ID }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "available=yes" >> "$GITHUB_OUTPUT"
          elif [ "$IS_FORK" = "true" ]; then
            echo "available=no" >> "$GITHUB_OUTPUT"
          else
            echo "KEEPER_BOT_APP_ID is missing outside a fork pull request." >&2
            exit 1
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: steps.content-access.outputs.available == 'yes'
        with:
          app-id: ${{ secrets.KEEPER_BOT_APP_ID }}
          private-key: ${{ secrets.KEEPER_BOT_PRIVATE_KEY }}
          owner: keeperdotsh
          repositories: seo

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the content submodule
        if: steps.content-access.outputs.available == 'yes'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/keeperdotsh/".insteadOf \
            "https://github.com/keeperdotsh/"
          git submodule update --init applications/web/seo
          test -d applications/web/seo/blog
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  unused:
    runs-on: ubuntu-latest
    steps:
      - id: content-access
        env:
          APP_ID: ${{ secrets.KEEPER_BOT_APP_ID }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "available=yes" >> "$GITHUB_OUTPUT"
          elif [ "$IS_FORK" = "true" ]; then
            echo "available=no" >> "$GITHUB_OUTPUT"
          else
            echo "KEEPER_BOT_APP_ID is missing outside a fork pull request." >&2
            exit 1
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: steps.content-access.outputs.available == 'yes'
        with:
          app-id: ${{ secrets.KEEPER_BOT_APP_ID }}
          private-key: ${{ secrets.KEEPER_BOT_PRIVATE_KEY }}
          owner: keeperdotsh
          repositories: seo

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the content submodule
        if: steps.content-access.outputs.available == 'yes'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/keeperdotsh/".insteadOf \
            "https://github.com/keeperdotsh/"
          git submodule update --init applications/web/seo
          test -d applications/web/seo/blog
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run unused

  test-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: calendar
            filter: --filter @keeper.sh/calendar
          - shard: services
            filter: --filter @keeper.sh/api --filter @keeper.sh/cron
          - shard: rest
            filter: --filter '!@keeper.sh/calendar' --filter '!@keeper.sh/api' --filter '!@keeper.sh/cron'
    services:
      postgres:
        image: postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94 # 17.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - id: content-access
        env:
          APP_ID: ${{ secrets.KEEPER_BOT_APP_ID }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "available=yes" >> "$GITHUB_OUTPUT"
          elif [ "$IS_FORK" = "true" ]; then
            echo "available=no" >> "$GITHUB_OUTPUT"
          else
            echo "KEEPER_BOT_APP_ID is missing outside a fork pull request." >&2
            exit 1
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: steps.content-access.outputs.available == 'yes'
        with:
          app-id: ${{ secrets.KEEPER_BOT_APP_ID }}
          private-key: ${{ secrets.KEEPER_BOT_PRIVATE_KEY }}
          owner: keeperdotsh
          repositories: seo

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the content submodule
        if: steps.content-access.outputs.available == 'yes'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/keeperdotsh/".insteadOf \
            "https://github.com/keeperdotsh/"
          git submodule update --init applications/web/seo
          test -d applications/web/seo/blog
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun -e 'console.log(require("node:os").availableParallelism(), require("node:os").cpus().length)'
      - run: bunx turbo run test ${{ matrix.filter }}
        env:
          KEEPER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  test:
    runs-on: ubuntu-latest
    needs: test-shard
    if: always()
    steps:
      - run: |
          if [ "${{ needs.test-shard.result }}" != "success" ]; then
            echo "test-shard result: ${{ needs.test-shard.result }}"
            exit 1
          fi

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94 # 17.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - id: content-access
        env:
          APP_ID: ${{ secrets.KEEPER_BOT_APP_ID }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "available=yes" >> "$GITHUB_OUTPUT"
          elif [ "$IS_FORK" = "true" ]; then
            echo "available=no" >> "$GITHUB_OUTPUT"
          else
            echo "KEEPER_BOT_APP_ID is missing outside a fork pull request." >&2
            exit 1
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: steps.content-access.outputs.available == 'yes'
        with:
          app-id: ${{ secrets.KEEPER_BOT_APP_ID }}
          private-key: ${{ secrets.KEEPER_BOT_PRIVATE_KEY }}
          owner: keeperdotsh
          repositories: seo

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the content submodule
        if: steps.content-access.outputs.available == 'yes'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/keeperdotsh/".insteadOf \
            "https://github.com/keeperdotsh/"
          git submodule update --init applications/web/seo
          test -d applications/web/seo/blog
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter @keeper.sh/database test:migrations
        env:
          MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
